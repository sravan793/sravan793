<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060A"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
      .cur{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .orbit{transform-origin:830px 128px;animation:r 18s linear infinite}
      @keyframes r{to{transform:rotate(360deg)}}
    </style>
  </defs>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect width="1000" height="260" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="259" rx="18" fill="none" stroke="#1F2937"/>

  <text x="56" y="70" class="mono" font-size="15" fill="#64748B">~/sravan $ whoami</text>
  <text x="54" y="138" class="mono" font-size="58" font-weight="700" fill="url(#accent)">SRAVAN</text>
  <text x="56" y="176" class="mono" font-size="19" fill="#E2E8F0">AI builder · founder in the making · Bengaluru</text>
  <text x="56" y="214" class="mono" font-size="15" fill="#94A3B8">&gt; shipping ideas into products<tspan class="cur" fill="#22D3EE"> █</tspan></text>

  <g class="orbit">
    <circle cx="830" cy="128" r="74" fill="none" stroke="#334155" stroke-dasharray="3 7"/>
    <circle cx="904" cy="128" r="6" fill="#22D3EE"/>
    <circle cx="756" cy="128" r="4" fill="#F472B6"/>
  </g>
  <circle cx="830" cy="128" r="44" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <text x="830" y="141" text-anchor="middle" class="mono" font-size="36" font-weight="700" fill="#F8FAFC">S/</text>
</svg>
